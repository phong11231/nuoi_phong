<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242736;
      --border: #2e3144;
      --text: #e4e4e7;
      --text2: #9ca3af;
      --primary: #6366f1;
      --primary-hover: #818cf8;
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f59e0b;
      --yellow: #eab308;
      --radius: 12px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    #loginPage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }

    .login-box h1 { font-size: 24px; margin-bottom: 8px; text-align: center; }
    .login-box p { color: var(--text2); text-align: center; margin-bottom: 24px; font-size: 14px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: var(--primary); }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-green { background: var(--green); color: #fff; }
    .btn-green:hover { opacity: 0.9; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-red:hover { opacity: 0.9; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-blue { background: #3b82f6; color: #fff; }
    .btn-blue:hover { opacity: 0.9; }
    .btn-yellow { background: var(--yellow); color: #000; }
    .btn-yellow:hover { opacity: 0.9; }

    .login-error { color: var(--red); font-size: 13px; text-align: center; margin-top: 12px; display: none; }

    #dashboardPage { display: none; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .topbar h1 { font-size: 18px; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      padding: 24px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .stat-card .label { font-size: 13px; color: var(--text2); margin-bottom: 4px; }
    .stat-card .value { font-size: 28px; font-weight: 700; }
    .stat-card .value.green { color: var(--green); }
    .stat-card .value.orange { color: var(--orange); }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 24px 0;
      font-size: 14px;
      flex-wrap: wrap;
    }
    .breadcrumb a { color: var(--primary); text-decoration: none; cursor: pointer; }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb .sep { color: var(--text2); }
    .breadcrumb .current { color: var(--text); font-weight: 600; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      margin-bottom: 16px;
    }
    .toolbar h2 { font-size: 16px; }
    .toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .phone-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      padding: 0 24px 24px;
    }

    .phone-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: border-color 0.2s;
    }
    .phone-card:hover { border-color: var(--primary); }

    .folder-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      cursor: pointer;
      transition: border-color 0.2s;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .folder-card:hover { border-color: var(--yellow); }
    .folder-icon { font-size: 36px; line-height: 1; }
    .folder-info { flex: 1; min-width: 0; }
    .folder-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .folder-meta { font-size: 12px; color: var(--text2); margin-top: 4px; }
    .folder-actions { display: flex; gap: 6px; }

    .phone-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .phone-name { font-size: 15px; font-weight: 600; }
    .phone-status { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .phone-status.running { background: rgba(34,197,94,0.15); color: var(--green); }
    .phone-status.stopped { background: rgba(239,68,68,0.15); color: var(--red); }
    .phone-status.creating { background: rgba(245,158,11,0.15); color: var(--orange); }
    .phone-status.error { background: rgba(239,68,68,0.15); color: var(--red); }

    .phone-info { font-size: 13px; color: var(--text2); margin-bottom: 4px; }
    .phone-info span { color: var(--text); }
    .phone-proxy { margin-top: 8px; padding: 8px 12px; background: var(--surface2); border-radius: 8px; font-size: 12px; color: var(--text2); }
    .phone-proxy span { color: var(--orange); }
    .phone-actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }

    .schedule-panel {
      margin: 0 24px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .schedule-panel h3 { font-size: 15px; margin-bottom: 16px; }
    .schedule-form { display: flex; gap: 16px; align-items: end; flex-wrap: wrap; }
    .schedule-form .form-group { margin-bottom: 0; }
    .schedule-form input {
      width: 100px; padding: 8px 12px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 14px; outline: none;
    }
    .schedule-form input:focus { border-color: var(--primary); }

    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; width: 100%; max-width: 420px;
    }
    .modal h3 { margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text2); }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { margin-bottom: 16px; }

    /* ===== FLOATING PHONE WINDOWS ===== */
    .phone-window {
      position: fixed;
      background: #000;
      border: 2px solid var(--border);
      border-radius: 8px;
      z-index: 500;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      overflow: hidden;
      min-width: 220px;
      min-height: 300px;
    }

    .phone-window.active-win { border-color: var(--primary); z-index: 501; }

    .phone-window .win-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: var(--surface);
      cursor: move;
      user-select: none;
      flex-shrink: 0;
    }

    .phone-window .win-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .phone-window .win-btns {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .phone-window .win-btn {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .win-btn-min { background: var(--orange); color: #000; }
    .win-btn-close { background: var(--red); color: #fff; }
    .win-btn-min:hover, .win-btn-close:hover { opacity: 0.8; }

    .phone-window iframe {
      flex: 1;
      border: none;
      background: #000;
      width: 100%;
    }

    .phone-window .win-resize {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      background: linear-gradient(135deg, transparent 50%, var(--text2) 50%);
      opacity: 0.5;
      border-radius: 0 0 6px 0;
    }

    .phone-window .win-resize:hover { opacity: 1; }

    /* ===== TASKBAR ===== */
    #taskbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: none;
      align-items: center;
      padding: 0 12px;
      gap: 6px;
      z-index: 600;
      overflow-x: auto;
    }

    #taskbar.has-items { display: flex; }

    .taskbar-item {
      padding: 4px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .taskbar-item:hover { border-color: var(--primary); }
    .taskbar-item.minimized { opacity: 0.6; }
    .taskbar-item.tb-active { border-color: var(--primary); background: var(--primary); color: #fff; }

    /* ===== SYSTEM STATS BAR ===== */
    .sys-bar {
      display: flex;
      gap: 16px;
      padding: 0 24px 16px;
      flex-wrap: wrap;
    }
    .sys-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      flex: 1;
      min-width: 200px;
    }
    .sys-card .sys-label {
      font-size: 12px;
      color: var(--text2);
      margin-bottom: 6px;
    }
    .sys-card .sys-value {
      font-size: 18px;
      font-weight: 700;
    }
    .ram-bar-bg {
      width: 100%;
      height: 8px;
      background: var(--surface2);
      border-radius: 4px;
      margin-top: 8px;
      overflow: hidden;
    }
    .ram-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s;
    }
  </style>
</head>
<body>

  <div id="loginPage">
    <div class="login-box">
      <h1>Phone Manager</h1>
      <p>Dang nhap de quan ly dien thoai ao</p>
      <div class="form-group">
        <label>Tai khoan</label>
        <input type="text" id="loginUser" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Mat khau</label>
        <input type="password" id="loginPass" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" onclick="doLogin()">Dang nhap</button>
      <div class="login-error" id="loginError">Sai tai khoan hoac mat khau</div>
    </div>
  </div>

  <div id="dashboardPage">
    <div class="topbar">
      <h1>Phone Manager</h1>
      <div class="topbar-right">
        <span id="userLabel" style="font-size:13px;color:var(--text2)"></span>
        <button class="btn btn-outline btn-sm" onclick="doLogout()">Dang xuat</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card"><div class="label">Tong phone</div><div class="value" id="statTotal">0</div></div>
      <div class="stat-card"><div class="label">Dang chay</div><div class="value green" id="statRunning">0</div></div>
      <div class="stat-card"><div class="label">Da dung</div><div class="value orange" id="statStopped">0</div></div>
    </div>

    <div class="sys-bar" id="sysBar">
      <div class="sys-card">
        <div class="sys-label">RAM</div>
        <div class="sys-value" id="sysRam">--</div>
        <div class="ram-bar-bg"><div class="ram-bar-fill" id="sysRamBar" style="width:0%;background:var(--green)"></div></div>
      </div>
      <div class="sys-card">
        <div class="sys-label">CPU</div>
        <div class="sys-value" id="sysCpu">--</div>
      </div>
      <div class="sys-card">
        <div class="sys-label">Uptime</div>
        <div class="sys-value" id="sysUptime">--</div>
      </div>
    </div>

    <div class="schedule-panel">
      <h3>Luan phien tu dong</h3>
      <div class="schedule-form">
        <div class="form-group"><label>Phone/luot</label><input type="number" id="schedBatch" value="3" min="1" max="10"></div>
        <div class="form-group"><label>Chay (phut)</label><input type="number" id="schedRun" value="30" min="5"></div>
        <div class="form-group"><label>Nghi (phut)</label><input type="number" id="schedRest" value="10" min="1"></div>
        <button class="btn btn-green btn-sm" id="schedBtn" onclick="toggleSchedule()">Bat</button>
        <span id="schedStatus" style="font-size:13px;color:var(--green);margin-left:12px;font-weight:600;"></span>
      </div>
    </div>

    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="toolbar" style="margin-top:16px">
      <h2 id="folderTitle">Danh sach</h2>
      <div class="toolbar-actions">
        <button class="btn btn-yellow btn-sm" onclick="openFolderModal()">+ Tao folder</button>
        <button class="btn btn-primary btn-sm" onclick="openCreateModal()">+ Tao phone</button>
        <button class="btn btn-green btn-sm" onclick="createBatch()">+ Tao 5 phone</button>
      </div>
    </div>

    <div class="phone-grid" id="phoneGrid"></div>
  </div>

  <!-- TASKBAR -->
  <div id="taskbar"></div>

  <!-- MODALS -->
  <div class="modal-overlay" id="createModal">
    <div class="modal">
      <h3>Tao phone moi</h3>
      <div class="form-group"><label>Ten phone</label><input type="text" id="phoneName" placeholder="VD: Zalo 01"></div>
      <div class="modal-actions">
        <button class="btn btn-outline btn-sm" onclick="closeCreateModal()">Huy</button>
        <button class="btn btn-primary btn-sm" onclick="createPhone()">Tao</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="folderModal">
    <div class="modal">
      <h3>Tao folder moi</h3>
      <div class="form-group"><label>Ten folder</label><input type="text" id="folderName" placeholder="VD: Nhom 1, Nguoi A"></div>
      <div class="modal-actions">
        <button class="btn btn-outline btn-sm" onclick="closeFolderModal()">Huy</button>
        <button class="btn btn-yellow btn-sm" onclick="createFolder()">Tao</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="renameModal">
    <div class="modal">
      <h3>Doi ten folder</h3>
      <input type="hidden" id="renameFolderId">
      <div class="form-group"><label>Ten moi</label><input type="text" id="renameInput"></div>
      <div class="modal-actions">
        <button class="btn btn-outline btn-sm" onclick="closeRenameModal()">Huy</button>
        <button class="btn btn-primary btn-sm" onclick="renameFolder()">Luu</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="proxyModal">
    <div class="modal">
      <h3>Cau hinh Proxy</h3>
      <input type="hidden" id="proxyPhoneId">
      <div class="form-group"><label>Proxy (host:port:user:pass)</label><input type="text" id="proxyInput" placeholder="103.179.189.46:19940:user:pass"></div>
      <div class="modal-actions">
        <button class="btn btn-outline btn-sm" onclick="closeProxyModal()">Huy</button>
        <button class="btn btn-primary btn-sm" onclick="saveProxy()">Luu</button>
      </div>
    </div>
  </div>

  <script>
    const API = '';
    let token = localStorage.getItem('token');
    let currentFolderId = null;

    function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    // ========== AUTH ==========
    async function doLogin() {
      const username = document.getElementById('loginUser').value;
      const password = document.getElementById('loginPass').value;
      const errEl = document.getElementById('loginError');
      errEl.style.display = 'none';
      try {
        const res = await fetch(API + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) { errEl.style.display = 'block'; return; }
        token = data.token;
        localStorage.setItem('token', token);
        showDashboard();
      } catch (e) { errEl.style.display = 'block'; }
    }

    function doLogout() {
      token = null;
      localStorage.removeItem('token');
      document.getElementById('loginPage').style.display = 'flex';
      document.getElementById('dashboardPage').style.display = 'none';
    }

    function showDashboard() {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('dashboardPage').style.display = 'block';
      document.getElementById('userLabel').textContent = 'Admin';
      currentFolderId = null;
      loadFolder();
      loadSchedule();
      loadAllStats();
    }

    function headers() {
      return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
    }

    // ========== FOLDER NAV ==========
    async function loadFolder() {
      try {
        const q = currentFolderId ? '?parentId=' + currentFolderId : '';
        const res = await fetch(API + '/api/folders' + q, { headers: headers() });
        if (res.status === 401) { doLogout(); return; }
        const data = await res.json();
        renderBreadcrumb(data.breadcrumb);
        renderGrid(data.folders, data.phones);
      } catch (e) { console.error(e); }
    }

    async function loadAllStats() {
      try {
        const res = await fetch(API + '/api/phones', { headers: headers() });
        if (res.status === 401) return;
        const phones = await res.json();
        document.getElementById('statTotal').textContent = phones.length;
        document.getElementById('statRunning').textContent = phones.filter(p => p.status === 'running').length;
        document.getElementById('statStopped').textContent = phones.filter(p => p.status === 'stopped').length;
      } catch (e) {}
      loadSystemStats();
    }

    async function loadSystemStats() {
      try {
        const res = await fetch(API + '/api/system', { headers: headers() });
        if (!res.ok) return;
        const s = await res.json();
        var pct = s.ram.percent;
        var color = pct > 85 ? 'var(--red)' : pct > 65 ? 'var(--orange)' : 'var(--green)';
        document.getElementById('sysRam').textContent = s.ram.used + ' / ' + s.ram.total + ' MB (' + pct + '%)';
        var bar = document.getElementById('sysRamBar');
        bar.style.width = pct + '%';
        bar.style.background = color;
        document.getElementById('sysCpu').textContent = s.cpu.cores + ' cores - Load: ' + s.cpu.load1m;
        var sec = Math.floor(s.uptime);
        var d = Math.floor(sec / 86400); sec %= 86400;
        var h = Math.floor(sec / 3600); sec %= 3600;
        var m = Math.floor(sec / 60);
        document.getElementById('sysUptime').textContent = d + ' ngay ' + h + 'h ' + m + 'm';
      } catch (e) {}
    }

    function navigateFolder(folderId) {
      currentFolderId = folderId || null;
      loadFolder();
    }

    function renderBreadcrumb(crumbs) {
      const el = document.getElementById('breadcrumb');
      let html = '<a onclick="navigateFolder(null)">Trang chu</a>';
      for (let i = 0; i < crumbs.length; i++) {
        html += ' <span class="sep">/</span> ';
        if (i < crumbs.length - 1) {
          html += '<a onclick="navigateFolder(\'' + crumbs[i].id + '\')">' + esc(crumbs[i].name) + '</a>';
        } else {
          html += '<span class="current">' + esc(crumbs[i].name) + '</span>';
        }
      }
      el.innerHTML = html;
      const title = document.getElementById('folderTitle');
      title.textContent = crumbs.length > 0 ? crumbs[crumbs.length - 1].name : 'Danh sach';
    }

    function renderGrid(folders, phones) {
      const grid = document.getElementById('phoneGrid');
      if (folders.length === 0 && phones.length === 0) {
        grid.innerHTML = '<div class="empty-state"><div class="icon">📁</div><p>Folder trong. Tao folder hoac phone de bat dau.</p></div>';
        return;
      }
      let html = '';
      for (const f of folders) {
        const safeName = esc(f.name);
        html += `
        <div class="folder-card" onclick="navigateFolder('${f.id}')">
          <div class="folder-icon">📁</div>
          <div class="folder-info">
            <div class="folder-name">${safeName}</div>
            <div class="folder-meta">Tao luc: ${new Date(f.createdAt).toLocaleDateString('vi-VN')}</div>
          </div>
          <div class="folder-actions" onclick="event.stopPropagation()">
            <button class="btn btn-outline btn-sm" onclick="openRenameModal('${f.id}', '${safeName.replace(/'/g, "\\'")}')">Sua</button>
            <button class="btn btn-red btn-sm" onclick="deleteFolder('${f.id}')">Xoa</button>
          </div>
        </div>`;
      }
      for (const p of phones) {
        const statusText = p.status === 'running' ? 'Dang chay' : p.status === 'creating' ? 'Dang tao...' : p.status === 'error' ? 'Loi' : 'Da dung';
        const safeName = esc(p.name);
        html += `
        <div class="phone-card">
          <div class="phone-header">
            <div class="phone-name">${safeName}</div>
            <div class="phone-status ${p.status}">${statusText}</div>
          </div>
          <div class="phone-info">Thiet bi: <span>${p.device.brand} ${p.device.model}</span></div>
          <div class="phone-info">Android: <span>${p.device.android}</span></div>
          <div class="phone-info">IMEI: <span>${p.device.imei}</span></div>
          <div class="phone-info">Port: <span>${p.port || '-'}</span></div>
          ${p.zaloInstalled ? '<div class="phone-info" style="color:var(--green)">Zalo: Da cai</div>' : ''}
          ${p.proxy ? '<div class="phone-proxy">Proxy: <span>' + p.proxy.split(':').slice(0,2).join(':') + '</span></div>' : '<div class="phone-proxy">Chua co proxy</div>'}
          <div id="proxyResult-${p.id}" style="font-size:12px;margin:4px 0;color:var(--green);display:none;"></div>
          <div class="phone-actions">
            ${p.status === 'running' ? '<button class="btn btn-blue btn-sm" onclick="openPhone(' + p.port + ', \'' + safeName.replace(/'/g, "\\'") + '\')">Mo</button>' : ''}
            ${p.status === 'stopped'
              ? '<button class="btn btn-green btn-sm" onclick="startPhone(\'' + p.id + '\')">Bat</button>'
              : p.status === 'running' ? '<button class="btn btn-red btn-sm" onclick="stopPhone(\'' + p.id + '\')">Tat</button>' : ''
            }
            <button class="btn btn-outline btn-sm" onclick="openProxyModal('${p.id}')">Proxy</button>
            ${p.status === 'running' ? '<button class="btn btn-outline btn-sm" onclick="checkProxy(\'' + p.id + '\')">Check IP</button>' : ''}
            <button class="btn btn-red btn-sm" onclick="deletePhone('${p.id}')">Xoa</button>
          </div>
        </div>`;
      }
      grid.innerHTML = html;
    }

    // ========== FOLDER CRUD ==========
    function openFolderModal() { document.getElementById('folderName').value = ''; document.getElementById('folderModal').classList.add('active'); }
    function closeFolderModal() { document.getElementById('folderModal').classList.remove('active'); }
    async function createFolder() {
      const name = document.getElementById('folderName').value.trim();
      if (!name) return alert('Nhap ten folder');
      await fetch(API + '/api/folders', { method: 'POST', headers: headers(), body: JSON.stringify({ name, parentId: currentFolderId }) });
      closeFolderModal();
      loadFolder();
    }
    function openRenameModal(id, name) {
      document.getElementById('renameFolderId').value = id;
      document.getElementById('renameInput').value = name;
      document.getElementById('renameModal').classList.add('active');
    }
    function closeRenameModal() { document.getElementById('renameModal').classList.remove('active'); }
    async function renameFolder() {
      const id = document.getElementById('renameFolderId').value;
      const name = document.getElementById('renameInput').value.trim();
      if (!name) return;
      await fetch(API + '/api/folders/' + id, { method: 'PUT', headers: headers(), body: JSON.stringify({ name }) });
      closeRenameModal();
      loadFolder();
    }
    async function deleteFolder(id) {
      if (!confirm('Xoa folder nay? Phone trong folder se duoc chuyen ra ngoai.')) return;
      await fetch(API + '/api/folders/' + id, { method: 'DELETE', headers: headers() });
      loadFolder();
    }

    // ========== PHONES ==========
    async function createPhone() {
      const name = document.getElementById('phoneName').value || '';
      await fetch(API + '/api/phones', { method: 'POST', headers: headers(), body: JSON.stringify({ name, folderId: currentFolderId }) });
      closeCreateModal();
      document.getElementById('phoneName').value = '';
      loadFolder();
      loadAllStats();
    }
    async function createBatch() {
      for (let i = 0; i < 5; i++) {
        await fetch(API + '/api/phones', { method: 'POST', headers: headers(), body: JSON.stringify({ name: '', folderId: currentFolderId }) });
      }
      loadFolder();
      loadAllStats();
    }
    async function startPhone(id) { await fetch(API + '/api/phones/' + id + '/start', { method: 'POST', headers: headers() }); loadFolder(); loadAllStats(); }
    async function stopPhone(id) { await fetch(API + '/api/phones/' + id + '/stop', { method: 'POST', headers: headers() }); loadFolder(); loadAllStats(); }
    async function deletePhone(id) {
      if (!confirm('Xoa phone nay?')) return;
      await fetch(API + '/api/phones/' + id, { method: 'DELETE', headers: headers() });
      loadFolder();
      loadAllStats();
    }

    // ========== FLOATING PHONE WINDOWS ==========
    let phoneWindows = {};
    let topZ = 501;

    function openPhone(port, name) {
      var winId = 'pw-' + port;
      if (phoneWindows[winId]) {
        var existing = phoneWindows[winId];
        if (existing.minimized) {
          existing.el.style.display = 'flex';
          existing.minimized = false;
        }
        bringToFront(winId);
        updateTaskbar();
        return;
      }

      var host = window.location.hostname;
      var udid = 'emulator-' + (port - 1);
      var wsParam = encodeURIComponent('ws://' + host + ':8000/?action=proxy-adb&remote=tcp%3A8886&udid=' + udid);
      var url = 'http://' + host + ':8000/#!action=stream&udid=' + udid + '&player=broadway&ws=' + wsParam;

      var count = Object.keys(phoneWindows).length;
      var offsetX = 60 + (count % 5) * 30;
      var offsetY = 60 + (count % 5) * 30;

      var win = document.createElement('div');
      win.className = 'phone-window active-win';
      win.id = winId;
      win.style.left = offsetX + 'px';
      win.style.top = offsetY + 'px';
      win.style.width = '340px';
      win.style.height = '620px';
      win.style.zIndex = ++topZ;

      win.innerHTML = '<div class="win-titlebar">' +
        '<span class="win-title">' + esc(name || 'Phone') + '</span>' +
        '<div class="win-btns">' +
          '<button class="win-btn win-btn-min" onclick="minimizeWin(\'' + winId + '\')" title="Thu nho">−</button>' +
          '<button class="win-btn win-btn-close" onclick="closeWin(\'' + winId + '\')" title="Dong">×</button>' +
        '</div>' +
      '</div>' +
      '<iframe src="' + url + '" allow="autoplay"></iframe>' +
      '<div class="win-resize"></div>';

      document.body.appendChild(win);

      phoneWindows[winId] = { el: win, name: name || 'Phone', port: port, minimized: false };

      win.addEventListener('mousedown', function() { bringToFront(winId); });
      initDrag(win, win.querySelector('.win-titlebar'));
      initResize(win, win.querySelector('.win-resize'));
      updateTaskbar();
    }

    function bringToFront(winId) {
      for (var k in phoneWindows) {
        phoneWindows[k].el.classList.remove('active-win');
      }
      var w = phoneWindows[winId];
      if (w) {
        w.el.style.zIndex = ++topZ;
        w.el.classList.add('active-win');
      }
      updateTaskbar();
    }

    function minimizeWin(winId) {
      var w = phoneWindows[winId];
      if (!w) return;
      w.el.style.display = 'none';
      w.minimized = true;
      updateTaskbar();
    }

    function closeWin(winId) {
      var w = phoneWindows[winId];
      if (!w) return;
      w.el.querySelector('iframe').src = '';
      w.el.remove();
      delete phoneWindows[winId];
      updateTaskbar();
    }

    function toggleWin(winId) {
      var w = phoneWindows[winId];
      if (!w) return;
      if (w.minimized) {
        w.el.style.display = 'flex';
        w.minimized = false;
        bringToFront(winId);
      } else if (w.el.classList.contains('active-win')) {
        minimizeWin(winId);
      } else {
        bringToFront(winId);
      }
      updateTaskbar();
    }

    function updateTaskbar() {
      var bar = document.getElementById('taskbar');
      var keys = Object.keys(phoneWindows);
      if (keys.length === 0) {
        bar.classList.remove('has-items');
        bar.innerHTML = '';
        return;
      }
      bar.classList.add('has-items');
      var html = '';
      for (var k of keys) {
        var w = phoneWindows[k];
        var cls = 'taskbar-item';
        if (w.minimized) cls += ' minimized';
        else if (w.el.classList.contains('active-win')) cls += ' tb-active';
        html += '<div class="' + cls + '" onclick="toggleWin(\'' + k + '\')">' + esc(w.name) + '</div>';
      }
      bar.innerHTML = html;
    }

    // ===== DRAG =====
    function initDrag(win, handle) {
      var startX, startY, origX, origY;
      handle.addEventListener('mousedown', function(e) {
        if (e.target.classList.contains('win-btn')) return;
        e.preventDefault();
        startX = e.clientX;
        startY = e.clientY;
        origX = win.offsetLeft;
        origY = win.offsetTop;
        function onMove(ev) {
          win.style.left = (origX + ev.clientX - startX) + 'px';
          win.style.top = (origY + ev.clientY - startY) + 'px';
        }
        function onUp() {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    }

    // ===== RESIZE =====
    function initResize(win, handle) {
      handle.addEventListener('mousedown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        var startX = e.clientX, startY = e.clientY;
        var origW = win.offsetWidth, origH = win.offsetHeight;
        var iframe = win.querySelector('iframe');
        iframe.style.pointerEvents = 'none';
        function onMove(ev) {
          var newW = Math.max(220, origW + ev.clientX - startX);
          var newH = Math.max(300, origH + ev.clientY - startY);
          win.style.width = newW + 'px';
          win.style.height = newH + 'px';
        }
        function onUp() {
          iframe.style.pointerEvents = '';
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    }

    // ========== PROXY ==========
    function openProxyModal(id) { document.getElementById('proxyPhoneId').value = id; document.getElementById('proxyModal').classList.add('active'); }
    function closeProxyModal() { document.getElementById('proxyModal').classList.remove('active'); }
    async function saveProxy() {
      const id = document.getElementById('proxyPhoneId').value;
      const proxy = document.getElementById('proxyInput').value.trim();
      if (!proxy) return alert('Nhap proxy');
      await fetch(API + '/api/phones/' + id + '/proxy', { method: 'PUT', headers: headers(), body: JSON.stringify({ proxy }) });
      closeProxyModal();
      loadFolder();
    }
    async function checkProxy(id) {
      const el = document.getElementById('proxyResult-' + id);
      el.style.display = 'block';
      el.style.color = 'var(--orange)';
      el.textContent = 'Dang kiem tra...';
      try {
        const res = await fetch(API + '/api/phones/' + id + '/check-proxy', { headers: headers() });
        const data = await res.json();
        if (data.ip) { el.style.color = 'var(--green)'; el.textContent = 'IP: ' + data.ip; }
        else { el.style.color = 'var(--red)'; el.textContent = 'Loi: ' + (data.error || 'Khong kiem tra duoc'); }
      } catch (e) { el.style.color = 'var(--red)'; el.textContent = 'Loi ket noi server'; }
    }

    // ========== SCHEDULE ==========
    let scheduleEnabled = false;
    async function toggleSchedule() {
      scheduleEnabled = !scheduleEnabled;
      await fetch(API + '/api/schedule', {
        method: 'PUT', headers: headers(),
        body: JSON.stringify({
          enabled: scheduleEnabled,
          phonesPerBatch: parseInt(document.getElementById('schedBatch').value),
          runMinutes: parseInt(document.getElementById('schedRun').value),
          restMinutes: parseInt(document.getElementById('schedRest').value),
        }),
      });
      updateSchedUI();
    }
    async function loadSchedule() {
      try {
        const res = await fetch(API + '/api/schedule', { headers: headers() });
        if (!res.ok) return;
        const data = await res.json();
        scheduleEnabled = data.config.enabled;
        document.getElementById('schedBatch').value = data.config.phonesPerBatch;
        document.getElementById('schedRun').value = data.config.runMinutes;
        document.getElementById('schedRest').value = data.config.restMinutes;
        updateSchedUI(data.phase);
      } catch (e) {}
    }
    function updateSchedUI(phase) {
      const btn = document.getElementById('schedBtn');
      const status = document.getElementById('schedStatus');
      btn.textContent = scheduleEnabled ? 'Tat' : 'Bat';
      btn.className = scheduleEnabled ? 'btn btn-red btn-sm' : 'btn btn-green btn-sm';
      if (status) {
        if (!scheduleEnabled) status.textContent = '';
        else if (phase === 'running') status.textContent = 'Dang chay';
        else if (phase === 'resting') status.textContent = 'Dang nghi...';
        else status.textContent = 'Da bat';
      }
    }

    // ========== MODAL ==========
    function openCreateModal() { document.getElementById('createModal').classList.add('active'); }
    function closeCreateModal() { document.getElementById('createModal').classList.remove('active'); }

    // ========== INIT ==========
    if (token) showDashboard();
    setInterval(function() { if (token) { loadFolder(); loadAllStats(); } }, 5000);
  </script>
</body>
</html>
