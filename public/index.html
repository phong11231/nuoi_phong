<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242736;
      --border: #2e3144;
      --text: #e4e4e7;
      --text2: #9ca3af;
      --primary: #6366f1;
      --primary-hover: #818cf8;
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f59e0b;
      --radius: 12px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ===== LOGIN ===== */
    #loginPage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }

    .login-box h1 {
      font-size: 24px;
      margin-bottom: 8px;
      text-align: center;
    }

    .login-box p {
      color: var(--text2);
      text-align: center;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary);
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      width: 100%;
    }

    .btn-primary:hover { background: var(--primary-hover); }

    .btn-green { background: var(--green); color: #fff; }
    .btn-green:hover { opacity: 0.9; }

    .btn-red { background: var(--red); color: #fff; }
    .btn-red:hover { opacity: 0.9; }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

    .btn-sm { padding: 6px 12px; font-size: 12px; }

    .login-error {
      color: var(--red);
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      display: none;
    }

    /* ===== DASHBOARD ===== */
    #dashboardPage { display: none; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .topbar h1 { font-size: 18px; }

    .topbar-right { display: flex; align-items: center; gap: 12px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      padding: 24px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .stat-card .label {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 4px;
    }

    .stat-card .value {
      font-size: 28px;
      font-weight: 700;
    }

    .stat-card .value.green { color: var(--green); }
    .stat-card .value.orange { color: var(--orange); }

    /* ===== TOOLBAR ===== */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      margin-bottom: 16px;
    }

    .toolbar h2 { font-size: 16px; }

    .toolbar-actions { display: flex; gap: 8px; }

    /* ===== PHONE GRID ===== */
    .phone-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      padding: 0 24px 24px;
    }

    .phone-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: border-color 0.2s;
    }

    .phone-card:hover { border-color: var(--primary); }

    .phone-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .phone-name {
      font-size: 15px;
      font-weight: 600;
    }

    .phone-status {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .phone-status.running { background: rgba(34,197,94,0.15); color: var(--green); }
    .phone-status.stopped { background: rgba(239,68,68,0.15); color: var(--red); }
    .phone-status.creating { background: rgba(245,158,11,0.15); color: var(--orange); }
    .phone-status.error { background: rgba(239,68,68,0.15); color: var(--red); }

    .btn-blue { background: #3b82f6; color: #fff; }
    .btn-blue:hover { opacity: 0.9; }

    .phone-info {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 4px;
    }

    .phone-info span { color: var(--text); }

    .phone-proxy {
      margin-top: 8px;
      padding: 8px 12px;
      background: var(--surface2);
      border-radius: 8px;
      font-size: 12px;
      color: var(--text2);
    }

    .phone-proxy span { color: var(--orange); }

    .phone-actions {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }

    /* ===== SCHEDULE PANEL ===== */
    .schedule-panel {
      margin: 0 24px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .schedule-panel h3 {
      font-size: 15px;
      margin-bottom: 16px;
    }

    .schedule-form {
      display: flex;
      gap: 16px;
      align-items: end;
      flex-wrap: wrap;
    }

    .schedule-form .form-group { margin-bottom: 0; }

    .schedule-form input {
      width: 100px;
      padding: 8px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .schedule-form input:focus { border-color: var(--primary); }

    /* ===== MODAL ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 420px;
    }

    .modal h3 { margin-bottom: 16px; }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text2);
    }

    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { margin-bottom: 16px; }
  </style>
</head>
<body>

  <!-- LOGIN PAGE -->
  <div id="loginPage">
    <div class="login-box">
      <h1>Phone Manager</h1>
      <p>Dang nhap de quan ly dien thoai ao</p>
      <div class="form-group">
        <label>Tai khoan</label>
        <input type="text" id="loginUser" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Mat khau</label>
        <input type="password" id="loginPass" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" onclick="doLogin()">Dang nhap</button>
      <div class="login-error" id="loginError">Sai tai khoan hoac mat khau</div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboardPage">
    <div class="topbar">
      <h1>Phone Manager</h1>
      <div class="topbar-right">
        <span id="userLabel" style="font-size:13px;color:var(--text2)"></span>
        <button class="btn btn-outline btn-sm" onclick="doLogout()">Dang xuat</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="label">Tong phone</div>
        <div class="value" id="statTotal">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Dang chay</div>
        <div class="value green" id="statRunning">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Da dung</div>
        <div class="value orange" id="statStopped">0</div>
      </div>
    </div>

    <!-- Schedule -->
    <div class="schedule-panel">
      <h3>Luan phien tu dong</h3>
      <div class="schedule-form">
        <div class="form-group">
          <label>Phone/luot</label>
          <input type="number" id="schedBatch" value="3" min="1" max="10">
        </div>
        <div class="form-group">
          <label>Chay (phut)</label>
          <input type="number" id="schedRun" value="30" min="5">
        </div>
        <div class="form-group">
          <label>Nghi (phut)</label>
          <input type="number" id="schedRest" value="10" min="1">
        </div>
        <button class="btn btn-green btn-sm" id="schedBtn" onclick="toggleSchedule()">Bat</button>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <h2>Danh sach phone</h2>
      <div class="toolbar-actions">
        <button class="btn btn-primary btn-sm" onclick="openCreateModal()">+ Tao phone</button>
        <button class="btn btn-green btn-sm" onclick="createBatch()">+ Tao 5 phone</button>
      </div>
    </div>

    <div class="phone-grid" id="phoneGrid">
      <div class="empty-state">
        <div class="icon">📱</div>
        <p>Chua co phone nao. Bam "Tao phone" de bat dau.</p>
      </div>
    </div>
  </div>

  <!-- CREATE PHONE MODAL -->
  <div class="modal-overlay" id="createModal">
    <div class="modal">
      <h3>Tao phone moi</h3>
      <div class="form-group">
        <label>Ten phone</label>
        <input type="text" id="phoneName" placeholder="VD: Zalo 01">
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline btn-sm" onclick="closeCreateModal()">Huy</button>
        <button class="btn btn-primary btn-sm" onclick="createPhone()">Tao</button>
      </div>
    </div>
  </div>

  <!-- PHONE VIEWER MODAL -->
  <div class="modal-overlay" id="viewerModal" style="z-index:200">
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:95%;max-width:420px;height:90vh;display:flex;flex-direction:column;position:relative;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);">
        <h3 id="viewerTitle" style="font-size:15px;margin:0;">Phone</h3>
        <button class="btn btn-red btn-sm" onclick="closeViewer()">Dong</button>
      </div>
      <iframe id="viewerFrame" style="flex:1;border:none;background:#000;border-radius:0 0 var(--radius) var(--radius);" allow="autoplay"></iframe>
    </div>
  </div>

  <!-- PROXY MODAL -->
  <div class="modal-overlay" id="proxyModal">
    <div class="modal">
      <h3>Cau hinh Proxy</h3>
      <input type="hidden" id="proxyPhoneId">
      <div class="form-group">
        <label>Proxy (host:port:user:pass)</label>
        <input type="text" id="proxyInput" placeholder="103.179.189.46:19940:user:pass">
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline btn-sm" onclick="closeProxyModal()">Huy</button>
        <button class="btn btn-primary btn-sm" onclick="saveProxy()">Luu</button>
      </div>
    </div>
  </div>

  <script>
    const API = '';
    let token = localStorage.getItem('token');

    // === AUTH ===
    async function doLogin() {
      const username = document.getElementById('loginUser').value;
      const password = document.getElementById('loginPass').value;
      const errEl = document.getElementById('loginError');
      errEl.style.display = 'none';

      try {
        const res = await fetch(API + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          errEl.style.display = 'block';
          return;
        }
        token = data.token;
        localStorage.setItem('token', token);
        showDashboard();
      } catch (e) {
        errEl.style.display = 'block';
      }
    }

    function doLogout() {
      token = null;
      localStorage.removeItem('token');
      document.getElementById('loginPage').style.display = 'flex';
      document.getElementById('dashboardPage').style.display = 'none';
    }

    function showDashboard() {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('dashboardPage').style.display = 'block';
      document.getElementById('userLabel').textContent = 'Admin';
      loadPhones();
    }

    function headers() {
      return {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token,
      };
    }

    // === PHONES ===
    async function loadPhones() {
      try {
        const res = await fetch(API + '/api/phones', { headers: headers() });
        if (res.status === 401) { doLogout(); return; }
        const phones = await res.json();
        renderPhones(phones);
        updateStats(phones);
      } catch (e) {
        console.error(e);
      }
    }

    function updateStats(phones) {
      document.getElementById('statTotal').textContent = phones.length;
      document.getElementById('statRunning').textContent = phones.filter(p => p.status === 'running').length;
      document.getElementById('statStopped').textContent = phones.filter(p => p.status === 'stopped').length;
    }

    function renderPhones(phones) {
      const grid = document.getElementById('phoneGrid');
      if (phones.length === 0) {
        grid.innerHTML = '<div class="empty-state"><div class="icon">📱</div><p>Chua co phone nao. Bam "Tao phone" de bat dau.</p></div>';
        return;
      }

      grid.innerHTML = phones.map(p => {
        const statusText = p.status === 'running' ? 'Dang chay' : p.status === 'creating' ? 'Dang tao...' : p.status === 'error' ? 'Loi' : 'Da dung';
        return `
        <div class="phone-card">
          <div class="phone-header">
            <div class="phone-name">${p.name}</div>
            <div class="phone-status ${p.status}">${statusText}</div>
          </div>
          <div class="phone-info">Thiet bi: <span>${p.device.brand} ${p.device.model}</span></div>
          <div class="phone-info">Android: <span>${p.device.android}</span></div>
          <div class="phone-info">Man hinh: <span>${p.device.screen}</span></div>
          <div class="phone-info">IMEI: <span>${p.device.imei}</span></div>
          <div class="phone-info">Port: <span>${p.port || '-'}</span></div>
          ${p.zaloInstalled ? '<div class="phone-info" style="color:var(--green)">Zalo: Da cai</div>' : ''}
          ${p.proxy ? `<div class="phone-proxy">Proxy: <span>${p.proxy.split(':').slice(0,2).join(':')}</span></div>` : '<div class="phone-proxy">Chua co proxy</div>'}
          <div id="proxyResult-${p.id}" style="font-size:12px;margin:4px 0;color:var(--green);display:none;"></div>
          <div class="phone-actions">
            ${p.status === 'running' ? `<button class="btn btn-blue btn-sm" onclick="openPhone(${p.port}, '${p.name.replace(/'/g, "\\'")}')">Mo</button>` : ''}
            ${p.status === 'stopped'
              ? `<button class="btn btn-green btn-sm" onclick="startPhone('${p.id}')">Bat</button>`
              : p.status === 'running' ? `<button class="btn btn-red btn-sm" onclick="stopPhone('${p.id}')">Tat</button>` : ''
            }
            <button class="btn btn-outline btn-sm" onclick="openProxyModal('${p.id}')">Proxy</button>
            ${p.status === 'running' ? `<button class="btn btn-outline btn-sm" onclick="checkProxy('${p.id}')">Check IP</button>` : ''}
            <button class="btn btn-red btn-sm" onclick="deletePhone('${p.id}')">Xoa</button>
          </div>
        </div>
      `}).join('');
    }

    async function createPhone() {
      const name = document.getElementById('phoneName').value || '';
      await fetch(API + '/api/phones', {
        method: 'POST',
        headers: headers(),
        body: JSON.stringify({ name }),
      });
      closeCreateModal();
      document.getElementById('phoneName').value = '';
      loadPhones();
    }

    async function createBatch() {
      for (let i = 0; i < 5; i++) {
        await fetch(API + '/api/phones', {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify({ name: '' }),
        });
      }
      loadPhones();
    }

    async function startPhone(id) {
      await fetch(API + '/api/phones/' + id + '/start', { method: 'POST', headers: headers() });
      loadPhones();
    }

    async function stopPhone(id) {
      await fetch(API + '/api/phones/' + id + '/stop', { method: 'POST', headers: headers() });
      loadPhones();
    }

    async function deletePhone(id) {
      if (!confirm('Xoa phone nay?')) return;
      await fetch(API + '/api/phones/' + id, { method: 'DELETE', headers: headers() });
      loadPhones();
    }

    // === OPEN PHONE ===
    function openPhone(port, name) {
      const host = window.location.hostname;
      // Port le (5555,5557,5559) -> emulator-(port-1) (5554,5556,5558)
      var udid = 'emulator-' + (port - 1);
      var wsParam = encodeURIComponent('ws://' + host + ':8000/?action=proxy-adb&remote=tcp%3A8886&udid=' + udid);
      var url = 'http://' + host + ':8000/#!action=stream&udid=' + udid + '&player=broadway&ws=' + wsParam;
      document.getElementById('viewerTitle').textContent = name || 'Phone';
      document.getElementById('viewerFrame').src = url;
      document.getElementById('viewerModal').classList.add('active');
    }

    function closeViewer() {
      document.getElementById('viewerModal').classList.remove('active');
      document.getElementById('viewerFrame').src = '';
    }

    // === PROXY ===
    function openProxyModal(id) {
      document.getElementById('proxyPhoneId').value = id;
      document.getElementById('proxyModal').classList.add('active');
    }

    function closeProxyModal() {
      document.getElementById('proxyModal').classList.remove('active');
    }

    async function saveProxy() {
      const id = document.getElementById('proxyPhoneId').value;
      const proxy = document.getElementById('proxyInput').value.trim();
      if (!proxy) return alert('Nhap proxy');

      await fetch(API + '/api/phones/' + id + '/proxy', {
        method: 'PUT',
        headers: headers(),
        body: JSON.stringify({ proxy }),
      });

      closeProxyModal();
      loadPhones();
    }

    async function checkProxy(id) {
      const el = document.getElementById('proxyResult-' + id);
      el.style.display = 'block';
      el.style.color = 'var(--orange)';
      el.textContent = 'Dang kiem tra...';
      try {
        const res = await fetch(API + '/api/phones/' + id + '/check-proxy', { headers: headers() });
        const data = await res.json();
        if (data.ip) {
          el.style.color = 'var(--green)';
          el.textContent = 'IP: ' + data.ip;
        } else {
          el.style.color = 'var(--red)';
          el.textContent = 'Loi: ' + (data.error || 'Khong kiem tra duoc');
        }
      } catch (e) {
        el.style.color = 'var(--red)';
        el.textContent = 'Loi ket noi server';
      }
    }

    // === SCHEDULE ===
    let scheduleEnabled = false;

    async function toggleSchedule() {
      scheduleEnabled = !scheduleEnabled;
      const btn = document.getElementById('schedBtn');

      await fetch(API + '/api/schedule', {
        method: 'PUT',
        headers: headers(),
        body: JSON.stringify({
          enabled: scheduleEnabled,
          phonesPerBatch: parseInt(document.getElementById('schedBatch').value),
          runMinutes: parseInt(document.getElementById('schedRun').value),
          restMinutes: parseInt(document.getElementById('schedRest').value),
        }),
      });

      btn.textContent = scheduleEnabled ? 'Tat' : 'Bat';
      btn.className = scheduleEnabled ? 'btn btn-red btn-sm' : 'btn btn-green btn-sm';
    }

    // === MODAL ===
    function openCreateModal() {
      document.getElementById('createModal').classList.add('active');
    }

    function closeCreateModal() {
      document.getElementById('createModal').classList.remove('active');
    }

    // === INIT ===
    if (token) {
      showDashboard();
    }

    // Auto refresh moi 5 giay
    setInterval(() => {
      if (token) loadPhones();
    }, 5000);
  </script>
</body>
</html>
